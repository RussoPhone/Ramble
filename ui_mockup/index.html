<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaea — tiles e ASCII</title>
  <style>
    :root { color-scheme: dark; --ink:#d3c8af; --dim:#9ba18f; --edge:#454a3e; --panel:#252b23; --accent:#b8a786; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { display:grid; grid-template-rows:1fr 44px; background:#1d231c; font-family:"Cascadia Mono","DejaVu Sans Mono",ui-monospace,monospace; }
    .world { position:relative; min-height:0; overflow:hidden; background:#171c16; border-bottom:1px solid var(--edge); }
    body.ascii .world { background:#121612; }
    canvas { display:block; width:100%; height:100%; cursor:crosshair; image-rendering:pixelated; }
    .tooltip { position:absolute; z-index:2; display:none; pointer-events:none; padding:5px 8px; border-left:2px solid var(--accent); background:#252b23; color:#d3cbb4; font-size:11px; line-height:1.3; }
    .command-line { display:flex; align-items:center; min-width:0; border-top:1px solid var(--edge); background:var(--panel); color:var(--ink); font-size:11px; white-space:nowrap; }
    .brand { align-self:stretch; display:flex; align-items:baseline; gap:10px; padding:0 14px; border-right:1px solid var(--edge); color:#d7c9ad; font:600 18px/1 Georgia,serif; letter-spacing:-.4px; }
    .brand small { font:10px/1 "Cascadia Mono",monospace; letter-spacing:.14em; color:var(--dim); text-transform:lowercase; }
    .commands { flex:1; display:flex; justify-content:center; align-items:center; gap:16px; overflow:hidden; padding:0 10px; }
    .command-line button { border:0; padding:4px 2px; background:transparent; color:inherit; font:inherit; cursor:pointer; }
    .command-line button:hover { color:#e0d4bb; }
    .key { color:#858d79; margin-right:4px; }
    .mode[aria-pressed="true"] { color:#e4d8ba; border-bottom:1px solid var(--accent); }
    .divider { color:#5c6452; }
    .speed { padding:0 14px; color:var(--dim); font-variant-numeric:tabular-nums; }
    body.ascii { --ink:#c4cdb6; --dim:#7f8a76; --edge:#3e4c39; --panel:#1a2019; --accent:#9aaa84; }
    body.ascii .brand { color:#c9d4b4; }
    body.ascii .key { color:#8a9380; }
    button:focus-visible { outline:1px solid var(--accent); outline-offset:2px; }
    @media (max-width:720px) { .brand small,.speed{display:none}.commands{gap:9px;font-size:10px} }
  </style>
</head>
<body class="tiles">
  <main class="world" aria-label="Mundo abstrato de Gaea">
    <canvas id="world"></canvas>
    <div class="tooltip" id="tooltip" role="tooltip"></div>
  </main>
  <footer class="command-line" aria-label="Comandos ilustrativos">
    <div class="brand">gaea <small>mockup</small></div>
    <div class="commands">
      <button class="mode" data-mode="tiles" aria-pressed="true"><span class="key">F1</span> TILES</button>
      <button class="mode" data-mode="ascii" aria-pressed="false"><span class="key">F2</span> ASCII</button>
      <span class="divider">::</span>
      <button type="button"><span class="key">SPACE</span> PAUSE</button>
      <button type="button"><span class="key">P</span> PLAY</button>
      <button type="button"><span class="key">.</span> STEP</button>
    </div>
    <div class="speed">SPEED&nbsp; − &nbsp;<span style="color:var(--ink)">1×</span>&nbsp; +</div>
  </footer>
  <script>
    const canvas=document.querySelector('#world'),frame=document.querySelector('.world'),tooltip=document.querySelector('#tooltip'),ctx=canvas.getContext('2d');
    const TILE_IMAGE=72,TILE_ASCII=42;
    let mode='tiles',grid={cols:0,rows:0,ox:0,oy:0,width:0,height:0,tile:TILE_IMAGE},cells=new Map();
    const files=['grass','water','stone','food','gaian-north','gaian-east','gaian-south','gaian-west'];
    const sprites=Object.fromEntries(files.map(name=>[name,Object.assign(new Image(),{src:`assets/${name}.png`})]));
    const stones=[[.09,.43],[.18,.76],[.29,.26],[.38,.59],[.49,.17],[.57,.76],[.66,.38],[.81,.69],[.91,.32],[.92,.84]];
    const foods=[[.13,.24],[.22,.53],[.32,.81],[.41,.35],[.51,.55],[.61,.22],[.72,.78],[.84,.47],[.88,.19],[.16,.87],[.46,.88]];
    const gaians=[{x:.18,y:.34,d:'east'},{x:.31,y:.47,d:'south'},{x:.44,y:.23,d:'north'},{x:.54,y:.68,d:'west'},{x:.70,y:.48,d:'east'},{x:.85,y:.73,d:'north'}];
    function key(x,y){return`${x},${y}`}
    function get(x,y){return cells.get(key(x,y))||'grass'}
    function set(x,y,value){cells.set(key(x,y),value)}
    function waterAt(x,y){const nx=(x+.5)/grid.cols,ny=(y+.5)/grid.rows;return Math.abs(nx-(.72+Math.sin(ny*7.3)*.065))<.065||((nx-.08)**2)/.006+((ny-.13)**2)/.014<1}
    function free(sx,sy){const bx=Math.floor(sx*grid.cols),by=Math.floor(sy*grid.rows);for(let r=0;r<8;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const x=bx+dx,y=by+dy;if(x>=0&&y>=0&&x<grid.cols&&y<grid.rows&&get(x,y)==='grass')return{x,y}}return{x:bx,y:by}}
    function build(){cells=new Map();for(let y=0;y<grid.rows;y++)for(let x=0;x<grid.cols;x++)if(waterAt(x,y))set(x,y,'water');stones.forEach(([x,y])=>{const p=free(x,y);set(p.x,p.y,'stone')});foods.forEach(([x,y])=>{const p=free(x,y);set(p.x,p.y,'food')});gaians.forEach(g=>{const p=free(g.x,g.y);set(p.x,p.y,{kind:'gaiano',direction:g.d})})}
    function resize(){const r=frame.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);grid.width=r.width;grid.height=r.height;layout();draw()}
    function layout(){grid.tile=mode==='tiles'?TILE_IMAGE:TILE_ASCII;grid.cols=Math.ceil(grid.width/grid.tile)+1;grid.rows=Math.ceil(grid.height/grid.tile)+1;grid.ox=Math.floor((grid.width-grid.cols*grid.tile)/2);grid.oy=Math.floor((grid.height-grid.rows*grid.tile)/2);build()}
    function drawTiles(){ctx.imageSmoothingEnabled=false;for(let y=0;y<grid.rows;y++)for(let x=0;x<grid.cols;x++){const px=grid.ox+x*grid.tile,py=grid.oy+y*grid.tile,cell=get(x,y),kind=typeof cell==='object'?cell.kind:cell;ctx.drawImage(sprites[kind==='water'?'water':'grass'],px,py,grid.tile,grid.tile);if(kind==='stone'||kind==='food')ctx.drawImage(sprites[kind],px,py,grid.tile,grid.tile);if(kind==='gaiano')ctx.drawImage(sprites[`gaian-${cell.direction}`],px,py,grid.tile,grid.tile)}}
    function drawAscii(){ctx.fillStyle='#080b08';ctx.fillRect(0,0,grid.width,grid.height);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 30px ui-monospace, monospace';const direction={north:'^',east:'>',south:'v',west:'<'};for(let y=0;y<grid.rows;y++)for(let x=0;x<grid.cols;x++){const px=grid.ox+x*grid.tile+grid.tile/2,py=grid.oy+y*grid.tile+grid.tile/2,cell=get(x,y),kind=typeof cell==='object'?cell.kind:cell;let glyph='"',color=(x+y)%3===0?'#577a45':'#45663a';if(kind==='water'){glyph='~';color=(x+y)%2?'#4fa2ae':'#6bb8bd'}if(kind==='stone'){glyph='#';color='#aaa58c'}if(kind==='food'){glyph='o';color='#ef754f'}if(kind==='gaiano'){glyph=direction[cell.direction];color='#f0d16a'}ctx.fillStyle=color;ctx.fillText(glyph,px,py)}}
    function draw(){ctx.clearRect(0,0,grid.width,grid.height);mode==='tiles'?drawTiles():drawAscii()}
    function changeMode(next){mode=next;document.body.className=mode;document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));layout();draw()}
    document.querySelector('.commands').addEventListener('click',event=>{const b=event.target.closest('[data-mode]');if(b)changeMode(b.dataset.mode)});
    addEventListener('keydown',event=>{if(event.key==='F1'){event.preventDefault();changeMode('tiles')}if(event.key==='F2'){event.preventDefault();changeMode('ascii')}});
    canvas.addEventListener('mousemove',event=>{const r=canvas.getBoundingClientRect(),lx=event.clientX-r.left,ly=event.clientY-r.top,x=Math.floor((lx-grid.ox)/grid.tile),y=Math.floor((ly-grid.oy)/grid.tile);if(x<0||y<0||x>=grid.cols||y>=grid.rows){tooltip.style.display='none';return}const cell=get(x,y),kind=typeof cell==='object'?cell.kind:cell;tooltip.textContent=`[${kind}]`;tooltip.style.display='block';tooltip.style.left=`${Math.min(lx+14,frame.clientWidth-tooltip.offsetWidth-8)}px`;tooltip.style.top=`${Math.min(ly+14,frame.clientHeight-tooltip.offsetHeight-8)}px`});
    canvas.addEventListener('mouseleave',()=>tooltip.style.display='none');
    Promise.all(Object.values(sprites).map(img=>img.decode().catch(()=>{}))).then(draw);
    new ResizeObserver(resize).observe(frame);
  </script>
</body>
</html>
